<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create an account for Santerra Financial Suite" />
  <title>Santerra - Sign In / Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-body">

  <!-- Header with Brand on Left and Back Link on Right -->
  <header class="app-header auth-header">
    <a href="index.html" class="logo-link">
      <div class="logo">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="2" fill="#111111"/>
          <rect x="10" y="2" width="6" height="6" rx="2" fill="#111111"/>
          <rect x="2" y="10" width="6" height="6" rx="2" fill="#111111"/>
        </svg>
        <span class="brand-title">Santerra</span>
      </div>
    </a>

    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Workspace</span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card-container">
      
      <!-- Top Segmented Switcher: Sign In vs Sign Up -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tabSignIn" role="tab" aria-selected="true">Sign In</button>
        <button type="button" class="auth-tab" id="tabSignUp" role="tab" aria-selected="false">Create Account</button>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">
        <div class="auth-card-header">
          <h1 class="auth-title" id="authTitle">Welcome back</h1>
          <p class="auth-subtitle" id="authSubtitle">Login to save your progress</p>
        </div>

        <!-- Notification Banner for Feedback -->
        <div class="auth-alert" id="authAlert" role="alert" style="display: none;"></div>

        <!-- Google OAuth Area (Single Button) -->
        <div class="auth-oauth-section">
          <!-- Official Google Button Render Target -->
          <div id="googleBtnWrapper" class="google-btn-wrapper"></div>

          <!-- Fallback Google Sign-In Button (Only if Google script is unavailable) -->
          <button type="button" class="google-custom-btn" id="googleCustomBtn" style="display: none;">
            <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="googleBtnLabel">Continue with Google</span>
          </button>
        </div>

        <div class="auth-divider">
          <span class="divider-line"></span>
          <span class="divider-text">or with email</span>
          <span class="divider-line"></span>
        </div>

        <!-- Email & Password Form -->
        <form class="auth-form" id="authForm" novalidate>
          <!-- Full Name (Only for Sign Up) -->
          <div class="form-group" id="nameGroup" style="display: none;">
            <label for="fullNameInput" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="fullNameInput" class="form-input" placeholder="Akshat Mohanty" autocomplete="name" />
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="emailInput" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="emailInput" class="form-input" placeholder="name@example.com" required autocomplete="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="label-row">
              <label for="passwordInput" class="form-label">Password</label>
              <a href="#" class="forgot-link" id="forgotPassLink">Forgot password?</a>
            </div>
            <div class="input-wrapper password-wrapper">
              <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-pass-btn" id="togglePassBtn" aria-label="Show or hide password">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-submit-btn" id="authSubmitBtn">
            <span class="btn-text" id="submitBtnText">Sign In</span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <div class="auth-card-footer">
          <p class="switch-prompt">
            <span id="switchPromptText">Don't have an account?</span>
            <button type="button" class="switch-link" id="switchModeBtn">Create one now</button>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Pinned Bottom Footer with Found a Bug? -->
  <footer class="copyright-footer">
    <span>© 2026 Akshat Mohanty. Built with ❤️</span>
    <span class="footer-separator">&middot;</span>
    <a href="https://github.com/Akshat-mohanty/Currency-Converter/issues" target="_blank" rel="noopener noreferrer" class="bug-link">Found a Bug?</a>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
