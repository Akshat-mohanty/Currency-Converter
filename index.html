<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Currency Converter – Real-time exchange rates for 160+ currencies. Fast, free, and beautifully designed." />
  <title>CurrencyX – Real-Time Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <canvas id="particles"></canvas>

  <main class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
            <path d="M2 12h20"/>
          </svg>
        </div>
        <span class="logo-text">CurrencyX</span>
      </div>
      <div class="header-badge">
        <span class="pulse-dot"></span>
        <span id="rateStatus">Live Rates</span>
      </div>
    </header>

    <!-- Converter Card -->
    <section class="converter-card" aria-label="Currency Converter">
      <div class="card-glow"></div>

      <h1 class="card-title">Convert Currencies</h1>
      <p class="card-subtitle">Real-time rates · 160+ world currencies</p>

      <!-- Amount Input -->
      <div class="input-group">
        <label for="amount" class="input-label">Amount</label>
        <div class="input-wrapper amount-wrapper">
          <span class="currency-symbol" id="fromSymbol">$</span>
          <input
            type="number"
            id="amount"
            class="input-field"
            value="1"
            min="0"
            step="any"
            placeholder="Enter amount"
            autocomplete="off"
            aria-label="Amount to convert"
          />
        </div>
      </div>

      <!-- Currency Selectors Row -->
      <div class="selectors-row">

        <!-- From Currency -->
        <div class="currency-select-group">
          <label class="input-label">From</label>
          <div class="cs-wrapper" id="fromWrapper">
            <button class="cs-trigger" id="fromTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select source currency">
              <span class="cs-flag" id="fromFlag">🇺🇸</span>
              <div class="cs-info">
                <span class="cs-code" id="fromCode">USD</span>
                <span class="cs-full" id="fromFull">US Dollar</span>
              </div>
              <svg class="cs-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="cs-panel" id="fromPanel" role="listbox" aria-label="From currency">
              <div class="cs-search-wrap">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="cs-search" id="fromSearch" placeholder="Search currency…" autocomplete="off" spellcheck="false" />
              </div>
              <ul class="cs-list" id="fromList" role="listbox"></ul>
            </div>
          </div>
        </div>

        <!-- Swap -->
        <div class="swap-container">
          <button id="swapBtn" class="swap-btn" type="button" aria-label="Swap currencies">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>

        <!-- To Currency -->
        <div class="currency-select-group">
          <label class="input-label">To</label>
          <div class="cs-wrapper" id="toWrapper">
            <button class="cs-trigger" id="toTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select target currency">
              <span class="cs-flag" id="toFlag">🇮🇳</span>
              <div class="cs-info">
                <span class="cs-code" id="toCode">INR</span>
                <span class="cs-full" id="toFull">Indian Rupee</span>
              </div>
              <svg class="cs-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="cs-panel" id="toPanel" role="listbox" aria-label="To currency">
              <div class="cs-search-wrap">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="cs-search" id="toSearch" placeholder="Search currency…" autocomplete="off" spellcheck="false" />
              </div>
              <ul class="cs-list" id="toList" role="listbox"></ul>
            </div>
          </div>
        </div>

      </div>

      <!-- Convert Button -->
      <button id="convertBtn" class="convert-btn" type="button" aria-label="Convert currency">
        <span class="btn-text">Convert</span>
        <div class="btn-spinner" id="btnSpinner" aria-hidden="true"></div>
      </button>

      <!-- Result -->
      <div class="result-container" id="resultContainer" aria-live="polite">
        <div class="result-inner">
          <div class="result-from" id="resultFrom">1.00 USD</div>
          <div class="result-equals">=</div>
          <div class="result-to" id="resultTo">–</div>
          <div class="result-rate" id="resultRate">Fetching rate…</div>
        </div>
      </div>

    </section>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-label">Inverse Rate</div>
        <div class="stat-value" id="inverseValue">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mid Market</div>
        <div class="stat-value" id="midValue">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Updated</div>
        <div class="stat-value" id="updatedValue">–</div>
      </div>
    </div>

    <!-- Popular Pairs -->
    <section class="popular-section" aria-label="Popular currency pairs">
      <h2 class="section-title">Popular Pairs</h2>
      <div class="pairs-grid" id="pairsGrid"></div>
    </section>

    <footer class="app-footer">
      <p>Rates by <a href="https://exchangerate.fun" target="_blank" rel="noopener noreferrer">ExchangeRate.fun</a> · Updated hourly</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
