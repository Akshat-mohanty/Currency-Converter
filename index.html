<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Currency Converter" />
  <title>Santerra - Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Using Outfit font which closely matches the rounded geometric font in the image -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Brand header matching the image "Santerra" -->
  <header class="app-header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="6" height="6" rx="2" fill="#000"/>
        <rect x="10" y="2" width="6" height="6" rx="2" fill="#000"/>
        <rect x="2" y="10" width="6" height="6" rx="2" fill="#000"/>
      </svg>
      <h1>Santerra</h1>
    </div>
  </header>

  <main class="main-content">
    
    <!-- We will focus purely on the converter UI from the image -->
    <div class="converter-wrapper">
      
      <!-- Exchange Boxes Container for precise absolute positioning -->
      <div class="exchange-boxes-wrapper">
        <!-- Top Section: From Currency -->
        <div class="exchange-box box-top">
          <div class="box-inner">
            <div class="amount-group">
              <!-- Amount Input -->
              <input type="number" id="fromAmount" class="amount-input" value="1000.00" min="0" step="any" placeholder="0.00" autocomplete="off" />
              <span class="funds-label">Amount</span>
            </div>
            
            <div class="currency-selector-group">
              <!-- Dropdown Trigger -->
              <div class="cs-wrapper" id="fromWrapper">
                <button class="cs-trigger" id="fromTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="cs-flag" id="fromFlag">🇺🇸</span>
                  <span class="cs-code" id="fromCode">USD</span>
                  <svg class="cs-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                
                <!-- Dropdown Panel -->
                <div class="cs-panel" id="fromPanel">
                  <div class="cs-search-row">
                    <input type="text" class="cs-search" id="fromSearch" placeholder="Search currency..." autocomplete="off" />
                  </div>
                  <ul class="cs-list" id="fromList"></ul>
                  <div class="cs-empty" id="fromEmpty">No results</div>
                </div>
              </div>
              <span class="funds-amount">$34,322.00</span>
            </div>
          </div>
        </div>

        <!-- Separator / Swap Button -->
        <div class="swap-container">
          <div class="swap-line line-left"></div>
          <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap currencies">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
            </svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
          <div class="swap-line line-right"></div>
        </div>

        <!-- Bottom Section: To Currency -->
        <div class="exchange-box box-bottom">
          <div class="box-inner">
            <div class="amount-group">
              <!-- Converted Amount Display -->
              <div class="amount-input result-value" id="resultValue">877.36</div>
              <span class="funds-label">Converted amount</span>
            </div>
            
            <div class="currency-selector-group">
              <!-- Dropdown Trigger -->
              <div class="cs-wrapper" id="toWrapper">
                <button class="cs-trigger" id="toTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="cs-flag" id="toFlag">🇪🇺</span>
                  <span class="cs-code" id="toCode">EUR</span>
                  <svg class="cs-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                
                <!-- Dropdown Panel -->
                <div class="cs-panel" id="toPanel">
                  <div class="cs-search-row">
                    <input type="text" class="cs-search" id="toSearch" placeholder="Search currency..." autocomplete="off" />
                  </div>
                  <ul class="cs-list" id="toList"></ul>
                  <div class="cs-empty" id="toEmpty">No results</div>
                </div>
              </div>
              <span class="funds-amount">€29,623.22</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Convert Button -->
      <button class="convert-btn" id="convertBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.44-1.28"/>
        </svg>
        <span class="btn-label">Convert</span>
        <div class="btn-spinner" id="btnSpinner"></div>
      </button>

      <!-- Footer Info -->
      <div class="rate-footer">
        <div class="rate-text" id="rateInfoText">1 USD = 0.86094 EUR • 1 EUR = 1.16147 USD</div>
        <div class="rate-time" id="lastUpdated">Mid-market rate at 08:52 UTC</div>
      </div>
      
      <div class="copyright-footer">
        © 2026 Akshat Mohanty. Built with ❤️
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
